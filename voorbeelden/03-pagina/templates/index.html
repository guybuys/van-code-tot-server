<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Weerstation</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Weerstation</h1>
    <p>De laatste meting van je station.</p>
    <table>
      <thead>
        <tr>
          <th>Grootheid</th>
          <th>Waarde</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Temperatuur</td>
          <td>{{ temperatuur }} °C</td>
        </tr>
        <tr>
          <td>Luchtdruk</td>
          <td>{{ luchtdruk }} hPa</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
