site_name: Van code tot server
site_description: Een weerstation bouwen, van de laptop tot een site op een server
site_author: Guy Buys
site_url: https://guybuys.github.io/van-code-tot-server/
repo_url: https://github.com/guybuys/van-code-tot-server
repo_name: guybuys/van-code-tot-server
docs_dir: docs
theme:
  name: material
  language: nl
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.footer
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - toc:
      permalink: true
nav:
  - Introductie: index.md
  - Werkomgeving:
      - VS Code: vscode.md
      - Git en GitHub: github.md
  - Backend:
      - Een eerste API: fastapi.md
